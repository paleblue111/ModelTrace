name: Async detection API tests
on:
  push:
    paths: ['*.py', 'requirements*.txt', 'tests/**', 'templates/**', 'static/*.js', 'static/status.css', 'Dockerfile', 'compose.yaml', '.github/workflows/api-tests.yml']
  pull_request:
    paths: ['*.py', 'requirements*.txt', 'tests/**', 'templates/**', 'static/*.js', 'static/status.css', 'Dockerfile', 'compose.yaml', '.github/workflows/api-tests.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-browser.txt
      - run: python -m pytest -q
      - run: node --check static/app.js
      - run: node --check static/status.js
      - run: python -m playwright install --with-deps chromium
      - run: python tests/status_browser.py
      - name: Validate Compose and build image
        run: |
          docker compose config --quiet
          docker compose build

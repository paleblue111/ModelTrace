name: Async detection API tests
on:
  push:
    paths: ['*.py', 'requirements*.txt', 'tests/**', 'templates/**', 'static/*.js', 'static/*.css', 'Dockerfile', 'compose.yaml', '.github/workflows/api-tests.yml']
  pull_request:
    paths: ['*.py', 'requirements*.txt', 'tests/**', 'templates/**', 'static/*.js', 'static/*.css', 'Dockerfile', 'compose.yaml', '.github/workflows/api-tests.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-browser.txt
      - run: python -m pytest -q
      - run: node --check static/status.js
      - run: node --check static/public.js && node --check static/admin-client.js && node --check static/admin-site.js && node --check static/admin-login.js
      - run: python -m playwright install --with-deps chromium
      - run: python tests/status_browser.py
      - run: python tests/public_browser.py
      - run: BROWSER_HTTPS_PROXY=1 python tests/public_browser.py
      - name: Validate Compose and build image
        run: |
          docker compose config --quiet
          docker compose build
      - name: Verify default Docker deployment
        run: |
          docker compose up -d --no-build --wait
          test "$(docker compose ps --status running --quiet worker | wc -l)" -eq 3
          curl --fail http://127.0.0.1:10001/healthz
          curl --fail --output /dev/null http://127.0.0.1:10001/status
      - name: Stop test containers
        if: always()
        run: docker compose down --volumes
